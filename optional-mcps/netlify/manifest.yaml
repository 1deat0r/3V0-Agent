# Nous-approved MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
manifest_version: 1

name: netlify
description: >-
  Sites, deploys, and env vars via Netlify's hosted MCP.
source: https://docs.netlify.com/build/build-with-ai/agent-setup-guides/agent-setup-overview/

# Official vendor-hosted remote MCP (URL-only — 3V0 never spawns a local
# process for this entry). Native OAuth 2.1 + Dynamic Client Registration;
# 3V0's MCP client + mcp_oauth_manager handle discovery, PKCE, token
# exchange, and refresh.
# No `netlify.app` suggest host for the same deploy-preview reason as vercel.app.
transport:
  type: http
  url: https://netlify-mcp.netlify.app/mcp

auth:
  type: oauth

# Composer-suggestion triggers (desktop brand pills).
suggest:
  keywords:
    - netlify
  hosts:
    - netlify.com

post_install: |
  On first connection 3V0 opens a browser to authorize with
  Netlify (or run `3v0 mcp login netlify`). Approve access,
  then restart the session so tools load.
