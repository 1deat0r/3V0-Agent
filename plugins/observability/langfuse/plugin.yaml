name: langfuse
version: "1.0.0"
description: "Optional Langfuse observability for 3V0 — traces conversations, LLM calls, and tool usage. Opt-in via `3v0 plugins enable observability/langfuse` or `3v0 tools → Langfuse Observability`."
author: NousResearch
requires_env:
  - EV0_LANGFUSE_PUBLIC_KEY
  - EV0_LANGFUSE_SECRET_KEY
hooks:
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
  - on_session_finalize
  - on_session_end
  - subagent_start
  - subagent_stop
